parameters:
    # Adds a fallback DATABASE_URL if the env var is not set.
    # This allows you to run cache:warmup or cache:clear even if your
    # environment variables are not available yet.
    # You may not need this, but it does not hurt to include it.
    database_host: '%env(resolve:DATABASE_HOST)%'
    database_port: '%env(resolve:DATABASE_PORT)%'
    database_name: '%env(resolve:DATABASE_NAME)%'
    database_user: '%env(resolve:DATABASE_USER)%'
    database_password: '%env(resolve:DATABASE_PASSWORD)%'

doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'
        driver: 'pdo_mysql'
        server_version: 'mariadb-10.11'
        charset: utf8mb4
        default_table_options:
            collate: utf8mb4_unicode_ci
        types:
            uuid: Ramsey\Uuid\Doctrine\UuidType

        # IMPORTANT: You MUST configure your server version,
        # either here or in the DATABASE_URL env var (see .env file)
        # server_version: '13'

    orm:
        auto_generate_proxy_classes: true
        naming_strategy: doctrine.orm.naming_strategy.underscore
        auto_mapping: true
        mappings:
            App:
                is_bundle: false
                type: attribute
                dir: '%kernel.project_dir%/src/Entity'
                prefix: 'App\Entity'
                alias: App

        # Enable migrations
        migrations_paths:
            'DoctrineMigrations': '%kernel.project_dir%/migrations'

when@test:
    doctrine:
        dbal:
            dbname_suffix: '_test%'

when@prod:
    doctrine:
        orm:
            auto_generate_proxy_classes: false
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system