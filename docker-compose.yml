services:

  # ------------------------------------------------------------
  # MariaDB
  # ------------------------------------------------------------
  mariadb:
    image: mariadb:10.11
    container_name: evounik_mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: root_password
      MARIADB_DATABASE: evounik_db
      MARIADB_USER: evounik_user
      MARIADB_PASSWORD: evounik_password
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - evounik_network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5


  # ------------------------------------------------------------
  # PHP-FPM / Symfony
  # ------------------------------------------------------------
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile

    container_name: evounik_php
    restart: unless-stopped

    working_dir: /var/www/html

    volumes:
      # Symfony source code
      - ./:/var/www/html

      # Keep Composer dependencies inside Docker
      - vendor_data:/var/www/html/vendor

    environment:
      APP_DEBUG: "1"
      APP_ENV: dev
      DATABASE_URL: "mysql://evounik_user:evounik_password@mariadb:3306/evounik_db?serverVersion=mariadb-10.11.0&charset=utf8mb4"
      REDIS_URL: redis://redis:6379

    networks:
      - evounik_network

    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_started


  # ------------------------------------------------------------
  # Nginx
  # ------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: evounik_nginx
    restart: unless-stopped

    ports:
      - "80:80"
      # Enable this later when SSL is configured:
      # - "443:443"

    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

      # Enable this later when HTTPS is configured:
      # - ./docker/nginx/ssl:/etc/nginx/ssl:ro

    networks:
      - evounik_network

    depends_on:
      - php


  # ------------------------------------------------------------
  # Redis
  # ------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: evounik_redis
    restart: unless-stopped

    volumes:
      - redis_data:/data

    networks:
      - evounik_network

  adminer:
    image: adminer
    container_name: evounik-adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on:
      - mariadb
    networks:
      - evounik_network


# --------------------------------------------------------------
# Volumes
# --------------------------------------------------------------
volumes:
  mariadb_data:
    driver: local

  redis_data:
    driver: local

  vendor_data:
    driver: local


# --------------------------------------------------------------
# Network
# --------------------------------------------------------------
networks:
  evounik_network:
    driver: bridge